<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="theme-color" content="#f8f3e8" />
  <link rel="apple-touch-icon" href="/icons-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>知识地图 · 香瓜</title>
  <meta name="description" content="香瓜的公开知识库：左侧导航、文章式条目和主题索引。" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/subpage.css" />
  <style>
    .knowledge-layout {
      gap: clamp(2rem, 5vw, 4rem);
    }

    .knowledge-sidebar .side-nav-entries a {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .knowledge-sidebar .side-nav-entries a span {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .knowledge-sidebar .side-nav-entries a.is-active span {
      color: inherit;
    }

    .knowledge-sidebar .sidebar-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .knowledge-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 1.5rem;
    }

    .knowledge-head .content-head {
      margin-bottom: 0;
    }

    .knowledge-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px 16px;
      padding-top: 18px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .knowledge-links a {
      color: var(--muted);
      text-decoration: none;
    }

    .knowledge-links a:hover,
    .knowledge-links a:focus-visible {
      color: var(--cinnabar);
    }

    .topic-strip {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.4rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line-soft);
    }

    .topic-strip .section-head {
      margin-bottom: 0;
      align-items: center;
    }

    .topic-strip .section-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .topic-strip .section-note {
      display: none;
    }

    .topic-strip .topic-grid {
      display: flex;
      gap: 10px;
      margin: 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 0 0 8px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .topic-strip .topic-grid::-webkit-scrollbar {
      height: 6px;
    }

    .topic-strip .topic-grid::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(73, 81, 73, 0.18);
    }

    .topic-strip .topic-card {
      flex: 0 0 220px;
      padding: 12px 14px;
      scroll-snap-align: start;
    }

    .topic-strip .topic-note {
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .topic-strip .topic-card-head {
      margin-bottom: 8px;
    }

    .topic-strip .topic-bar-track {
      display: none;
    }

    .article-section {
      padding-top: 1.25rem;
      border-top: 1px solid rgba(73, 81, 73, 0.12);
    }

    .article-section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .article-section h3 {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .article-section p {
      margin: 0;
      color: var(--ink);
      line-height: 1.8;
    }

    .article-section p + p {
      margin-top: 12px;
    }

    .detail-list {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--ink);
      line-height: 1.8;
    }

    @media (max-width: 960px) {
      .knowledge-layout {
        grid-template-columns: 1fr;
      }

      .knowledge-head {
        grid-template-columns: 1fr;
      }

      .knowledge-links {
        justify-content: flex-start;
        padding-top: 0;
      }

      .knowledge-sidebar {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .topic-strip .topic-card {
        flex-basis: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="shell">
    <div class="layout knowledge-layout">
      <aside class="side-nav knowledge-sidebar" aria-label="页面导航">
        <a class="side-nav-logo" href="/">香瓜</a>
        <a href="/reading/">读书笔记</a>
        <a href="/ideas/">个人 Idea</a>
        <a href="/work/">工作成果</a>
        <a class="is-active" href="/knowledge/">知识地图</a>
        <div class="side-nav-divider"></div>
        <div class="side-nav-entries" id="sidebarList">
          <p class="sidebar-note">正在加载条目…</p>
        </div>
      </aside>

      <main class="knowledge-main">
        <div class="knowledge-head">
          <div class="content-head">
            <p class="eyebrow">Knowledge index</p>
            <h1>知识地图</h1>
            <p>把公开精选条目、主题索引和入口都收在这里，方便快速浏览、索引和跳转。</p>
          </div>
          <nav class="knowledge-links" aria-label="快速跳转">
            <a href="/">首页</a>
            <a href="/reading/">读书笔记</a>
            <a href="/ideas/">个人 Idea</a>
            <a href="/work/">工作成果</a>
          </nav>
        </div>

        <section class="topic-strip" id="topics" aria-label="主题索引">
          <div class="section-head">
            <h2>主题索引</h2>
            <p class="section-note">公开地图里的主题，用来快速定位内容方向。</p>
          </div>
          <div class="topic-grid" id="topicGrid">
            <p class="topic-status">正在加载主题…</p>
          </div>
        </section>

        <div class="note-list">
          <article class="note is-visible" id="selected">
            <div class="note-head">
              <h2 id="selectedTitle">正在加载内容…</h2>
              <p class="note-meta" id="selectedMeta"></p>
            </div>
            <div class="prose">
              <p class="detail-summary" id="selectedSummary"></p>
              <div class="article-body" id="selectedArticle"></div>
            </div>
          </article>
        </div>
      </main>
    </div>

  </div>

  <script>
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function getSelectedId() {
      var params = new URLSearchParams(window.location.search);
      return params.get('item') || '';
    }

    function renderSidebar(items, selectedId) {
      var sidebar = document.getElementById('sidebarList');
      sidebar.innerHTML = items.map(function (item) {
        var active = item.id === selectedId ? ' is-active' : '';
        return '' +
          '<a class="sidebar-link' + active + '" href="?item=' + encodeURIComponent(item.id) + '#selected">' +
          '<strong>' + escapeHtml(item.title) + '</strong>' +
          '<span>' + escapeHtml(item.category) + ' · ' + escapeHtml(item.topic) + '</span>' +
          '</a>';
      }).join('');
    }

    function renderSelected(item) {
      document.getElementById('selectedTitle').textContent = item.title || '';
      document.getElementById('selectedMeta').textContent = (item.category || '精选条目') + ' · ' + (item.topic || '主题');
      document.getElementById('selectedSummary').textContent = item.summary || '';
      var article = item.article && Array.isArray(item.article.sections) ? item.article : null;
      var body = document.getElementById('selectedArticle');
      var html = [];
      if (article && article.lede) {
        html.push('<div class="article-section"><p>' + escapeHtml(article.lede) + '</p></div>');
      } else if (item.details) {
        html.push('<div class="article-section"><p>' + escapeHtml(item.details) + '</p></div>');
      }
      if (article) {
        article.sections.forEach(function (section) {
          var sectionHtml = '<div class="article-section">';
          if (section.title) {
            sectionHtml += '<h3>' + escapeHtml(section.title) + '</h3>';
          }
          if (Array.isArray(section.paragraphs)) {
            sectionHtml += section.paragraphs.map(function (paragraph) {
              return '<p>' + escapeHtml(paragraph) + '</p>';
            }).join('');
          }
          if (Array.isArray(section.bullets) && section.bullets.length) {
            sectionHtml += '<ul class="detail-list">' + section.bullets.map(function (point) {
              return '<li>' + escapeHtml(point) + '</li>';
            }).join('') + '</ul>';
          }
          sectionHtml += '</div>';
          html.push(sectionHtml);
        });
      } else if (item.highlights && item.highlights.length) {
        html.push('<div class="article-section"><ul class="detail-list">' + item.highlights.map(function (point) {
          return '<li>' + escapeHtml(point) + '</li>';
        }).join('') + '</ul></div>');
      }
      body.innerHTML = html.join('');
    }

    function renderTopics(topics) {
      var grid = document.getElementById('topicGrid');
      var maxWeight = topics.reduce(function (max, topic) {
        return Math.max(max, topic.weight || 0);
      }, 1);

      grid.innerHTML = topics.map(function (topic) {
        var fill = Math.max(6, Math.round(((topic.weight || 0) / maxWeight) * 100));
        return '' +
          '<article class="topic-card">' +
          '<div class="topic-card-head">' +
          '<strong>' + escapeHtml(topic.name || '') + '</strong>' +
          '<span class="topic-type">' + escapeHtml(topic.type || '') + '</span>' +
          '</div>' +
          '<div class="topic-bar-track"><div class="topic-bar-fill" style="width:' + fill + '%"></div></div>' +
          '<p class="topic-note">' + escapeHtml(topic.note || '') + '</p>' +
          '</article>';
      }).join('');
    }

    function loadKnowledge() {
      fetch('/data/knowledge-public.json')
        .then(function (response) {
          if (!response.ok) throw new Error('Failed to load knowledge data');
          return response.json();
        })
        .then(function (data) {
          var items = Array.isArray(data.featured) ? data.featured.slice() : [];
          if (!items.length) {
            items = [];
          }
          if (!items.length) {
            document.getElementById('sidebarList').innerHTML = '<p class="sidebar-note">暂无精选条目。</p>';
            return;
          }

          var selectedId = getSelectedId();
          var selected = items.find(function (item) {
            return item.id === selectedId;
          }) || items[0];

          document.title = data.profile.name + ' · ' + data.profile.title;

          renderSidebar(items, selected.id);
          renderSelected(selected);
          renderTopics(data.topics || []);
        })
        .catch(function () {
          document.getElementById('sidebarList').innerHTML = '<p class="sidebar-note">知识库数据加载失败，请稍后重试。</p>';
          document.getElementById('selectedTitle').textContent = '数据加载失败';
          document.getElementById('selectedMeta').textContent = '';
          document.getElementById('selectedSummary').textContent = '';
          document.getElementById('selectedArticle').innerHTML = '';
        });
    }

    loadKnowledge();
  </script>
</body>
</html>
