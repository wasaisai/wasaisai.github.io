<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="theme-color" content="#f8f3e8" />
  <link rel="apple-touch-icon" href="/icons-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>知识库 · 香瓜</title>
  <meta name="description" content="香瓜的公开知识库：左侧导航、文章式条目和分类筛选。" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/subpage.css" />
  <style>
    .knowledge-layout {
      gap: clamp(2rem, 5vw, 4rem);
    }

    .knowledge-sidebar a:hover,
    .knowledge-sidebar a:focus-visible,
    .knowledge-sidebar a.is-active {
      background: rgba(0, 0, 0, 0.03);
    }

    .knowledge-sidebar a.is-active {
      box-shadow: 0 10px 32px rgba(35, 41, 33, 0.04);
    }

    .side-nav-entries-head {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .knowledge-sidebar .side-nav-entries a {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .knowledge-sidebar .side-nav-entries a span {
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0;
      text-transform: none;
    }

    .knowledge-sidebar .side-nav-entries a.is-active span {
      color: inherit;
    }

    .knowledge-sidebar .sidebar-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .knowledge-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 1.5rem;
    }

    .knowledge-head .content-head {
      margin-bottom: 0;
    }

    .topic-strip {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.4rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line-soft);
    }

    .topic-strip .topic-grid {
      display: flex;
      gap: 10px;
      margin: -10px -14px -8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 10px 14px 16px;
      scroll-padding-inline: 14px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .topic-strip .topic-grid::-webkit-scrollbar {
      height: 6px;
    }

    .topic-strip .topic-grid::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(73, 81, 73, 0.18);
    }

    .topic-intro {
      max-width: 68ch;
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .topic-chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(95, 125, 79, 0.22);
      border-radius: 999px;
      background: rgba(95, 125, 79, 0.1);
      color: var(--muted);
      text-decoration: none;
      scroll-snap-align: start;
      transform-origin: center;
      transition: transform 180ms var(--ease-out-expo), border-color 180ms var(--ease-out-expo), box-shadow 180ms var(--ease-out-expo);
    }

    .topic-chip:hover,
    .topic-chip:focus-visible,
    .topic-chip.is-active {
      background: rgba(95, 125, 79, 0.1);
      border-color: rgba(95, 125, 79, 0.36);
      color: var(--ink);
      transform: scale(1.05);
      box-shadow: 0 8px 18px rgba(95, 125, 79, 0.14);
    }

    .topic-chip:active {
      background: rgba(95, 125, 79, 0.1);
      transform: scale(1.03);
    }

    .knowledge-main .note-list {
      min-height: 110vh;
    }

    .topic-chip strong {
      font-family: var(--font-serif);
      font-size: 0.96rem;
      font-weight: 600;
    }

    .topic-chip span {
      color: var(--blue);
      font-size: 0.72rem;
    }

    .article-section {
      padding-top: 1.25rem;
      border-top: 1px solid rgba(73, 81, 73, 0.12);
    }

    .article-section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .article-section h3 {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .article-section p {
      margin: 0;
      color: var(--ink);
      line-height: 1.8;
    }

    .article-section p + p {
      margin-top: 12px;
    }

    .detail-list {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--ink);
      line-height: 1.8;
    }

    @media (max-width: 960px) {
      .knowledge-layout {
        grid-template-columns: 1fr;
      }

      .knowledge-head {
        grid-template-columns: 1fr;
      }

      .knowledge-sidebar {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .topic-chip {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="shell">
    <div class="layout knowledge-layout">
      <aside class="side-nav knowledge-sidebar" aria-label="页面导航">
        <a class="side-nav-logo" href="/">香瓜</a>
        <a href="/reading/">读书笔记</a>
        <a href="/ideas/">个人 Idea</a>
        <a href="/work/">工作成果</a>
        <a class="is-active" href="/knowledge/">知识库</a>
        <div class="side-nav-divider"></div>
        <p class="side-nav-entries-head" id="sidebarHeading">文章列表</p>
        <div class="side-nav-entries" id="sidebarList">
          <p class="sidebar-note">正在加载条目…</p>
        </div>
      </aside>

      <main class="knowledge-main">
        <div class="knowledge-head">
          <div class="content-head">
            <p class="eyebrow">Knowledge index</p>
            <h1>知识库</h1>
            <p>把公开精选条目和分类入口都收在这里，方便快速浏览、索引和跳转。</p>
          </div>
        </div>

        <section class="topic-strip" id="topics" aria-label="主题筛选">
          <div class="topic-grid" id="topicGrid">
            <p class="topic-status">正在加载主题…</p>
          </div>
          <p class="topic-intro" id="topicIntro"></p>
        </section>

        <div class="note-list">
          <article class="note is-visible" id="selected">
            <div class="note-head">
              <h2 id="selectedTitle">正在加载内容…</h2>
              <p class="note-meta" id="selectedMeta"></p>
            </div>
            <div class="prose">
              <p class="detail-summary" id="selectedSummary"></p>
              <div class="article-body" id="selectedArticle"></div>
            </div>
          </article>
        </div>
      </main>
    </div>

  </div>

  <script>
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function getSelectedId() {
      var params = new URLSearchParams(window.location.search);
      return params.get('item') || '';
    }

    function getSelectedTopicId() {
      var params = new URLSearchParams(window.location.search);
      return params.get('topic') || '';
    }

    function buildKnowledgeHref(topicId, itemId) {
      var params = new URLSearchParams();
      if (topicId) params.set('topic', topicId);
      if (itemId) params.set('item', itemId);
      return '?' + params.toString();
    }

    function renderSidebar(items, selectedId, selectedTopic) {
      var sidebar = document.getElementById('sidebarList');
      var heading = document.getElementById('sidebarHeading');
      if (heading) {
        heading.textContent = selectedTopic ? selectedTopic.name + ' · 文章' : '文章列表';
      }
      if (!items.length) {
        sidebar.innerHTML = '<p class="sidebar-note">这个主题暂时没有公开文章。</p>';
        return;
      }
      sidebar.innerHTML = items.map(function (item) {
        var active = item.id === selectedId ? ' is-active' : '';
        return '' +
          '<a class="sidebar-link' + active + '" href="' + buildKnowledgeHref(item.topic, item.id) + '">' +
          '<strong>' + escapeHtml(item.title) + '</strong>' +
          '<span>' + escapeHtml(item.category) + ' · ' + escapeHtml(item.topic) + '</span>' +
          '</a>';
      }).join('');
    }

    function renderSelected(item, selectedTopic) {
      document.getElementById('selectedTitle').textContent = item.title || '';
      document.getElementById('selectedMeta').textContent = (item.category || '精选条目') + ' · ' + (selectedTopic.name || '主题');
      document.getElementById('selectedSummary').textContent = item.summary || '';
      var article = item.article && Array.isArray(item.article.sections) ? item.article : null;
      var body = document.getElementById('selectedArticle');
      var html = [];
      if (article && article.lede) {
        html.push('<div class="article-section"><p>' + escapeHtml(article.lede) + '</p></div>');
      } else if (item.details) {
        html.push('<div class="article-section"><p>' + escapeHtml(item.details) + '</p></div>');
      }
      if (article) {
        article.sections.forEach(function (section) {
          var sectionHtml = '<div class="article-section">';
          if (section.title) {
            sectionHtml += '<h3>' + escapeHtml(section.title) + '</h3>';
          }
          if (Array.isArray(section.paragraphs)) {
            sectionHtml += section.paragraphs.map(function (paragraph) {
              return '<p>' + escapeHtml(paragraph) + '</p>';
            }).join('');
          }
          if (Array.isArray(section.bullets) && section.bullets.length) {
            sectionHtml += '<ul class="detail-list">' + section.bullets.map(function (point) {
              return '<li>' + escapeHtml(point) + '</li>';
            }).join('') + '</ul>';
          }
          sectionHtml += '</div>';
          html.push(sectionHtml);
        });
      } else if (item.highlights && item.highlights.length) {
        html.push('<div class="article-section"><ul class="detail-list">' + item.highlights.map(function (point) {
          return '<li>' + escapeHtml(point) + '</li>';
        }).join('') + '</ul></div>');
      }
      body.innerHTML = html.join('');
    }

    function renderEmptyTopic(selectedTopic) {
      document.getElementById('selectedTitle').textContent = selectedTopic.name + '文章正在整理';
      document.getElementById('selectedMeta').textContent = selectedTopic.name + ' · 等待完整原始材料';
      document.getElementById('selectedSummary').textContent = '这个主题已经保留入口。为了不根据零散标题推断内容，文章会在完整聊天记录整理后发布。';
      document.getElementById('selectedArticle').innerHTML = '';
    }

    function renderTopics(topics, items, selectedTopicId) {
      var grid = document.getElementById('topicGrid');
      var selectedTopic = topics.find(function (topic) {
        return topic.id === selectedTopicId;
      });
      grid.innerHTML = topics.map(function (topic) {
        var count = items.filter(function (item) {
          return item.topic === topic.id;
        }).length;
        var active = topic.id === selectedTopicId ? ' is-active' : '';
        return '' +
          '<a class="topic-chip' + active + '" href="' + buildKnowledgeHref(topic.id, '') + '">' +
          '<strong>' + escapeHtml(topic.name || '') + '</strong>' +
          '<span>' + count + ' 篇</span>' +
          '</a>';
      }).join('');
      document.getElementById('topicIntro').textContent = selectedTopic ? selectedTopic.intro || '' : '';
    }

    function loadKnowledge() {
      fetch('/data/knowledge-public.json')
        .then(function (response) {
          if (!response.ok) throw new Error('Failed to load knowledge data');
          return response.json();
        })
        .then(function (data) {
          var items = Array.isArray(data.featured) ? data.featured.slice() : [];
          var topics = Array.isArray(data.topics) ? data.topics.slice() : [];
          if (!topics.length) {
            throw new Error('No knowledge topics');
          }
          var selectedId = getSelectedId();
          var requestedTopicId = getSelectedTopicId();
          var selected = items.find(function (item) {
            return item.id === selectedId;
          });
          var requestedTopic = topics.find(function (topic) {
            return topic.id === requestedTopicId;
          });
          var selectedTopicId = (requestedTopic && requestedTopic.id) || (selected && selected.topic) || topics[0].id;
          var topicItems = items.filter(function (item) {
            return item.topic === selectedTopicId;
          });
          selected = topicItems.find(function (item) {
            return item.id === selectedId;
          }) || topicItems[0] || null;
          var topicById = topics.reduce(function (map, topic) {
            map[topic.id] = topic;
            return map;
          }, {});
          var selectedTopic = topicById[selectedTopicId];

          document.title = data.profile.name + ' · ' + data.profile.title;

          renderSidebar(topicItems, selected ? selected.id : '', selectedTopic);
          renderTopics(topics, items, selectedTopicId);
          if (selected) {
            renderSelected(selected, selectedTopic);
          } else {
            renderEmptyTopic(selectedTopic);
          }
        })
        .catch(function () {
          document.getElementById('sidebarList').innerHTML = '<p class="sidebar-note">知识库数据加载失败，请稍后重试。</p>';
          document.getElementById('selectedTitle').textContent = '数据加载失败';
          document.getElementById('selectedMeta').textContent = '';
          document.getElementById('selectedSummary').textContent = '';
          document.getElementById('selectedArticle').innerHTML = '';
          document.getElementById('topicIntro').textContent = '';
        });
    }

    document.addEventListener('click', function (event) {
      var chip = event.target.closest('.topic-chip');
      if (!chip) return;
      event.preventDefault();
      var url = new URL(chip.href, window.location.href);
      window.history.replaceState(null, '', url.pathname + url.search);
      loadKnowledge();
    });

    window.addEventListener('popstate', loadKnowledge);

    loadKnowledge();
  </script>
</body>
</html>
