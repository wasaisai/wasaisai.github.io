<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="theme-color" content="#f8f3e8" />
  <link rel="apple-touch-icon" href="/icons-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>香瓜 · 知识库</title>
  <meta name="description" content="香瓜的公开知识库：左侧导航、文章式条目和主题索引。" />
  <link rel="stylesheet" href="/css/home.css" />
  <style>
    .knowledge-layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      padding-top: 2.25rem;
      padding-bottom: 2rem;
    }

    .knowledge-sidebar {
      position: sticky;
      top: 92px;
      display: grid;
      gap: 14px;
    }

    .sidebar-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }

    .sidebar-card h3 {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 1rem;
    }

    .sidebar-list {
      display: grid;
      gap: 8px;
    }

    .sidebar-link {
      display: block;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      text-decoration: none;
      line-height: 1.45;
      transition: background 180ms var(--ease-out-expo), border-color 180ms var(--ease-out-expo), color 180ms var(--ease-out-expo);
    }

    .sidebar-link:hover,
    .sidebar-link:focus-visible {
      background: rgba(255, 255, 255, 0.65);
      border-color: var(--line);
      color: var(--ink);
    }

    .sidebar-link.is-active {
      background: rgba(255, 255, 255, 0.88);
      border-color: rgba(184, 84, 47, 0.28);
      color: var(--ink);
      box-shadow: 0 10px 28px rgba(35, 41, 33, 0.05);
    }

    .sidebar-link strong {
      display: block;
      margin-bottom: 3px;
      font-weight: 600;
    }

    .sidebar-link span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .sidebar-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.7;
    }

    .knowledge-main {
      min-width: 0;
    }

    .detail-card {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow-md);
      margin-bottom: 26px;
    }

    .detail-top {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    .detail-badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--paper-deep);
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .detail-title {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 3.3vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .detail-summary {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
      max-width: 52rem;
    }

    .article-body {
      display: grid;
      gap: 18px;
      max-width: 56rem;
    }

    .article-section {
      padding-top: 18px;
      border-top: 1px solid rgba(73, 81, 73, 0.12);
    }

    .article-section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .article-section h3 {
      margin: 0 0 10px;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .article-section p {
      margin: 0;
      color: var(--ink);
      line-height: 1.8;
    }

    .article-section p + p {
      margin-top: 12px;
    }

    .detail-list {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--ink);
      line-height: 1.8;
    }

    @media (max-width: 960px) {
      .knowledge-layout {
        grid-template-columns: 1fr;
      }

      .knowledge-sidebar {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .detail-card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="shell">
    <nav class="nav" aria-label="主导航">
      <a class="nav-logo" href="/">香瓜</a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="/">首页</a>
        <a href="#selected">精选条目</a>
        <a href="#topics">主题索引</a>
      </div>
    </nav>

    <section class="knowledge-layout">
      <aside class="knowledge-sidebar">
        <div class="sidebar-card">
          <h3>精选条目</h3>
          <div class="sidebar-list" id="sidebarList">
            <p class="sidebar-note">正在加载条目…</p>
          </div>
        </div>
      </aside>

      <main class="knowledge-main">
        <article class="detail-card" id="selected">
          <div class="detail-top">
            <span class="detail-badge" id="selectedCategory">精选条目</span>
            <span class="detail-badge" id="selectedTopic">主题</span>
          </div>
          <h2 class="detail-title" id="selectedTitle">正在加载内容…</h2>
          <p class="detail-summary" id="selectedSummary"></p>
          <div class="article-body" id="selectedArticle"></div>
        </article>

        <section class="section knowledge-section" id="topics">
          <div class="section-head">
            <h2>主题索引</h2>
            <p class="section-note">公开地图里的主题，用来快速定位内容方向。</p>
          </div>
          <div class="topic-grid" id="topicGrid">
            <p class="topic-status">正在加载主题…</p>
          </div>
        </section>
      </main>
    </section>

    <footer class="footer">
      <div class="footer-links">
        <a href="/">首页</a>
        <a href="#selected">精选条目</a>
        <a href="#topics">主题索引</a>
      </div>
    </footer>
  </div>

  <script>
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function getSelectedId() {
      var params = new URLSearchParams(window.location.search);
      return params.get('item') || '';
    }

    function renderSidebar(items, selectedId) {
      var sidebar = document.getElementById('sidebarList');
      sidebar.innerHTML = items.map(function (item) {
        var active = item.id === selectedId ? ' is-active' : '';
        return '' +
          '<a class="sidebar-link' + active + '" href="?item=' + encodeURIComponent(item.id) + '#selected">' +
          '<strong>' + escapeHtml(item.title) + '</strong>' +
          '<span>' + escapeHtml(item.category) + ' · ' + escapeHtml(item.topic) + '</span>' +
          '</a>';
      }).join('');
    }

    function renderSelected(item) {
      document.getElementById('selectedCategory').textContent = item.category || '精选条目';
      document.getElementById('selectedTopic').textContent = item.topic || '主题';
      document.getElementById('selectedTitle').textContent = item.title || '';
      document.getElementById('selectedSummary').textContent = item.summary || '';
      var article = item.article && Array.isArray(item.article.sections) ? item.article : null;
      var body = document.getElementById('selectedArticle');
      var html = [];
      if (article && article.lede) {
        html.push('<div class="article-section"><p>' + escapeHtml(article.lede) + '</p></div>');
      } else if (item.details) {
        html.push('<div class="article-section"><p>' + escapeHtml(item.details) + '</p></div>');
      }
      if (article) {
        article.sections.forEach(function (section) {
          var sectionHtml = '<div class="article-section">';
          if (section.title) {
            sectionHtml += '<h3>' + escapeHtml(section.title) + '</h3>';
          }
          if (Array.isArray(section.paragraphs)) {
            sectionHtml += section.paragraphs.map(function (paragraph) {
              return '<p>' + escapeHtml(paragraph) + '</p>';
            }).join('');
          }
          if (Array.isArray(section.bullets) && section.bullets.length) {
            sectionHtml += '<ul class="detail-list">' + section.bullets.map(function (point) {
              return '<li>' + escapeHtml(point) + '</li>';
            }).join('') + '</ul>';
          }
          sectionHtml += '</div>';
          html.push(sectionHtml);
        });
      } else if (item.highlights && item.highlights.length) {
        html.push('<div class="article-section"><ul class="detail-list">' + item.highlights.map(function (point) {
          return '<li>' + escapeHtml(point) + '</li>';
        }).join('') + '</ul></div>');
      }
      body.innerHTML = html.join('');
    }

    function renderTopics(topics) {
      var grid = document.getElementById('topicGrid');
      var maxWeight = topics.reduce(function (max, topic) {
        return Math.max(max, topic.weight || 0);
      }, 1);

      grid.innerHTML = topics.map(function (topic) {
        var fill = Math.max(6, Math.round(((topic.weight || 0) / maxWeight) * 100));
        return '' +
          '<article class="topic-card">' +
          '<div class="topic-card-head">' +
          '<strong>' + escapeHtml(topic.name || '') + '</strong>' +
          '<span class="topic-type">' + escapeHtml(topic.type || '') + '</span>' +
          '</div>' +
          '<div class="topic-bar-track"><div class="topic-bar-fill" style="width:' + fill + '%"></div></div>' +
          '<p class="topic-note">' + escapeHtml(topic.note || '') + '</p>' +
          '</article>';
      }).join('');
    }

    function loadKnowledge() {
      fetch('/data/knowledge-public.json')
        .then(function (response) {
          if (!response.ok) throw new Error('Failed to load knowledge data');
          return response.json();
        })
        .then(function (data) {
          var items = Array.isArray(data.featured) ? data.featured.slice() : [];
          if (!items.length) {
            items = [];
          }
          if (!items.length) {
            document.getElementById('sidebarList').innerHTML = '<p class="sidebar-note">暂无精选条目。</p>';
            return;
          }

          var selectedId = getSelectedId();
          var selected = items.find(function (item) {
            return item.id === selectedId;
          }) || items[0];

          document.title = data.profile.name + ' · ' + data.profile.title;

          renderSidebar(items, selected.id);
          renderSelected(selected);
          renderTopics(data.topics || []);
        })
        .catch(function () {
          document.getElementById('sidebarList').innerHTML = '<p class="sidebar-note">知识库数据加载失败，请稍后重试。</p>';
          document.getElementById('selectedTitle').textContent = '数据加载失败';
          document.getElementById('selectedSummary').textContent = '';
          document.getElementById('selectedArticle').innerHTML = '';
        });
    }

    loadKnowledge();
  </script>
  <script src="/js/home.js" defer></script>
</body>
</html>
